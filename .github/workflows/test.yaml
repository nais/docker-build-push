name: Test action

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cache-smoke:
    name: Registry cache smoke test
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # ratchet:docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:v0.32.2
            network=host

      # Exercises the cache_backend=registry path: container driver + pinned
      # BuildKit + type=registry cache export against a local registry.
      - name: Populate the registry cache
        run: |
          mkdir -p smoke
          printf 'FROM alpine:3.20\nRUN echo smoke > /marker\n' > smoke/Dockerfile
          docker buildx build smoke \
            --cache-to type=registry,ref=localhost:5000/cache,mode=max,image-manifest=true,oci-mediatypes=true \
            --output type=cacheonly

      # A fresh builder has no local cache, so a CACHED step here can only come
      # from importing the cache that the previous step exported to the registry.
      - name: Rebuild on a fresh builder and assert the cache imports
        run: |
          docker buildx create --name verify \
            --driver docker-container \
            --driver-opt image=moby/buildkit:v0.32.2,network=host
          docker buildx build smoke \
            --builder verify \
            --cache-from type=registry,ref=localhost:5000/cache \
            --output type=cacheonly \
            --progress plain 2>&1 | tee import.log
          grep -q 'CACHED' import.log || {
            echo "::error ::registry cache import produced no cache hits"
            exit 1
          }
